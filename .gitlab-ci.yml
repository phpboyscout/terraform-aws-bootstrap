# ---------------------------------------------------------------------------
# phpboyscout/terraform-aws-bootstrap CI pipeline.
#
# Imports the four reusable components from phpboyscout/cicd.
# Each component runs in registry.gitlab.com/phpboyscout/images/infra-tools
# at the tag pinned by the component's image_version default (v0.2.0
# as of cicd v0.1.1). Renovate keeps the @vX.Y.Z component refs
# current as cicd cuts new releases.
# ---------------------------------------------------------------------------

stages:
  - lint
  - security
  - test
  - pages

# ---------- lint: tofu fmt + tflint + terraform-docs drift -------------

include:
  - component: gitlab.com/phpboyscout/cicd/tofu-lint@v0.1.1
    inputs:
      stage: lint
      # `.` runs `tofu fmt -recursive` from root (covers everything) and
      # `tflint --chdir=. --recursive`. The terraform-docs job iterates
      # each path: pass the root + each module + each example so every
      # README gets its tables re-injected.
      paths: ". modules/automation-iam modules/nuke-config modules/state-backend examples/minimal examples/gitlab"

  - component: gitlab.com/phpboyscout/cicd/tofu-security@v0.1.1
    inputs:
      stage: security
      # Single path; trivy / checkov walk the tree themselves and
      # gitleaks scans every tracked file regardless.
      paths: "."

  - component: gitlab.com/phpboyscout/cicd/tofu-validate@v0.1.1
    inputs:
      stage: test
      # Root + each sub-module + each example. tofu-validate skips any
      # dir without *.tf files automatically.
      validate_paths: ". modules/automation-iam modules/nuke-config modules/state-backend examples/minimal examples/gitlab"

  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.1.1
    inputs:
      stage: pages
      # zensical.toml + docs/ + requirements-lock.txt all at repo root.
      # Defaults (working_directory=., docs_path=docs,
      # python_lock=requirements-lock.txt, deploy_branch=main) match.
